# NÃO TESTADO nesta máquina (sem Docker). Valide em staging antes de usar.
services:
  api:
    build: ..
    env_file: ../.env
    environment:
      FLASH_DATABASE_URL: postgresql+psycopg://flash:${POSTGRES_PASSWORD}@db:5432/flash
    volumes: [flash-data:/data, ./secrets:/run/secrets:ro]
    ports: ["8000:8000"]
    depends_on: [db]
    restart: unless-stopped
  worker:
    build: ..
    command: ["flash", "worker", "--threads", "4"]
    env_file: ../.env
    environment:
      FLASH_DATABASE_URL: postgresql+psycopg://flash:${POSTGRES_PASSWORD}@db:5432/flash
    volumes: [flash-data:/data, ./secrets:/run/secrets:ro]
    depends_on: [db]
    restart: unless-stopped
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: flash
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: flash
    volumes: [pg-data:/var/lib/postgresql/data]
    restart: unless-stopped
volumes:
  flash-data:
  pg-data:
